{% if page.has_other_pages %}<nav class="pagination" aria-label="Results pages">{% if page.has_previous %}<a class="button" href="?page={{ page.previous_page_number }}{% if category %}&amp;filter={{ category }}{% endif %}">Previous</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button" href="?page={{ page.next_page_number }}{% if category %}&amp;filter={{ category }}{% endif %}">Next</a>{% endif %}</nav>{% endif %}
