services:
  web:
    command:
      - cs-map-trainer-web
      - runserver
      - 0.0.0.0:8000
      - --noreload
      - --insecure
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_TRUST_PROXY: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000,http://host.docker.internal:8000,http://web:8000
      PUBLIC_BASE_URL: http://localhost:8000
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "0"
      DEFAULT_FROM_EMAIL: trainer@example.test
      R2_ENDPOINT: ""
      R2_BUCKET: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      STEAM_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_PRICE_ID: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PORTAL_CONFIGURATION_ID: ""

  mail:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8025:8025"
