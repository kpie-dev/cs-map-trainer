[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cs-map-trainer"
version = "0.1.0"
description = "Validated training scenarios reconstructed from CS2 duels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "awpy==3.1.1",
    "pydantic>=2.14.1,<3",
]

[project.scripts]
cs-map-trainer = "cs_map_trainer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cs_map_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
