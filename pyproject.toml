[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cs-map-trainer"
version = "0.1.0"
description = "Validated training scenarios reconstructed from CS2 duels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "awpy==3.1.1",
    "boto3>=1.40,<2",
    "cryptography>=46,<48",
    "django>=5.2,<5.3",
    "django-allauth[mfa]>=65,<66",
    "django-q2>=1.8,<2",
    "gunicorn>=23,<26",
    "psycopg[binary]>=3.2,<4",
    "psutil>=7,<8",
    "pydantic>=2.14.1,<3",
    "requests>=2.32,<3",
]

[project.scripts]
cs-map-trainer = "cs_map_trainer.cli:main"
cs-map-trainer-web = "cs_map_trainer.web.manage:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cs_map_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
DJANGO_SETTINGS_MODULE = "web_settings"
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
